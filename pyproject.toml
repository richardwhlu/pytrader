[project]
name = "pytrader"
version = "0.1.0"
description = "A personal platform for developing, backtesting, and tracking XGBoost algorithmic-trading strategies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xgboost>=2.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "flask>=3.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pytrader-serve = "pytrader.cli:main"
pytrader-backtest = "pytrader.cli:run_backtest_cli"
pytrader-download = "pytrader.cli:run_download_cli"

[tool.pytest.ini_options]
testpaths = ["pytrader/tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
